<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Tin Tức</title>
    <style>
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        margin: 0;
        background: linear-gradient(135deg, #1a1a2e, #16213e);
        color: #f1f1f1;
      }

      /* ===== FORM QUẢN LÝ ===== */
      .container h2 {
        margin: 32px 0 16px;
        font-size: 1.5rem;
        font-weight: 600;
        color: #e0e0ff;
        border-bottom: 2px solid rgba(102, 126, 234, 0.3);
        padding-bottom: 8px;
      }

      input,
      textarea {
        width: 100%;
        padding: 12px 14px;
        margin-bottom: 14px;
        border-radius: 10px;
        border: 1.5px solid #3f4c6b;
        background: #0f3460;
        color: #fff;
        font-size: 1rem;
        transition: all 0.2s;
      }

      input:focus,
      textarea:focus {
        border-color: #667eea;
        outline: none;
        background: #1b1b3a;
        box-shadow: 0 0 6px rgba(102, 126, 234, 0.4);
      }

      /* ===== CARD TIN TỨC ===== */
      .card {
        background: #1e1e3f;
        padding: 18px;
        margin-bottom: 18px;
        border-radius: 14px;
        display: flex;
        gap: 18px;
        align-items: flex-start;
        border-left: 5px solid #667eea;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 24px rgba(102, 126, 234, 0.35);
      }

      .card img {
        width: 120px;
        height: 120px;
        border-radius: 12px;
        object-fit: cover;
        border: 2px solid #3f4c6b;
      }

      .card-info h3 {
        margin: 0 0 8px;
        font-size: 1.2rem;
        color: #fff;
        font-weight: 600;
      }

      .card-info p {
        margin: 0;
        font-size: 0.95rem;
        color: #c9c9d9;
        line-height: 1.5;
      }

      /* ===== NÚT HÀNH ĐỘNG ===== */
      .actions {
        margin-top: 12px;
        display: flex;
        gap: 12px;
      }

      .actions button {
        padding: 8px 16px;
        font-size: 0.9rem;
        font-weight: 500;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.25s ease;
        color: #fff;
      }
      /* ===== NÚT LƯU (Chính) ===== */
      button {
        padding: 12px 28px;
        background: linear-gradient(90deg, #667eea, #764ba2);
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 1rem;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        transition: all 0.25s ease;
      }

      button:hover {
        background: linear-gradient(90deg, #764ba2, #667eea);
        transform: translateY(-2px) scale(1.03);
      }

      /* Nút sửa */
      .actions button:first-child {
        background: linear-gradient(90deg, #36d1dc, #5b86e5);
        box-shadow: 0 2px 6px rgba(91, 134, 229, 0.4);
      }

      .actions button:first-child:hover {
        background: linear-gradient(90deg, #5b86e5, #36d1dc);
        transform: scale(1.05);
      }

      /* Nút xóa */
      .actions button:last-child {
        background: linear-gradient(90deg, #ff416c, #ff4b2b);
        box-shadow: 0 2px 6px rgba(255, 65, 108, 0.4);
      }

      .actions button:last-child:hover {
        background: linear-gradient(90deg, #ff4b2b, #ff416c);
        transform: scale(1.05);
      }

      /* Sidebar */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 220px;
        height: 100%;
        background: linear-gradient(180deg, #1a1a1a, #2a2a2a);
        border-right: 1px solid #333;
        padding: 32px 0;
        display: flex;
        flex-direction: column;
        box-shadow: 4px 0 15px rgba(0, 0, 0, 0.4);
        z-index: 999;
      }

      /* Dịch container sang phải để tránh bị che */
      .container {
        margin-left: 240px; /* bằng width sidebar */
        transition: margin-left 0.3s ease;
        padding-left: 10px;
      }

      /* Responsive: Sidebar thu gọn trên mobile */
      @media (max-width: 992px) {
        .sidebar {
          width: 200px;
        }
        .container {
          margin-left: 200px;
        }
      }

      @media (max-width: 768px) {
        .sidebar {
          position: fixed;
          left: -240px;
          transition: left 0.3s ease;
        }
        .sidebar.open {
          left: 0;
        }
        .container {
          margin-left: 0;
        }
      }
    </style>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet" />

    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <i class="fas fa-film"></i>
        <span>Movix Admin</span>
      </div>
      <nav class="sidebar-nav">
        <a href="../index.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a href="../phim/phim.html"><i class="fas fa-video"></i> Phim</a>
        <a href="../suatchieu/index.html"
          ><i class="fas fa-film"></i> Rạp chiếu</a
        >
        <a href="../tintuc/index.html" class="active"
          ><i class="fas fa-newspaper"></i> Tin tức</a
        >
        <a href="../giaodien/giaodien.html"
          ><i class="fas fa-building"></i> Giao diện</a
        >
        <a href="../giaodien/voucher.html"
          ><i class="fas fa-gift"></i> Voucher</a
        >
        <a href="../food/food.html"><i class="fas fa-pizza-slice"></i> Food</a>
        <a href="../user/user.html"><i class="fas fa-user"></i> User</a>
      </nav>
    </aside>

    <!-- Nội dung chính -->
    <div class="container">
      <h2>Thêm / Sửa Tin Tức</h2>
      <input type="text" id="title" placeholder="Tiêu đề" />
      <textarea id="desc" rows="3" placeholder="Mô tả"></textarea>
      <input type="text" id="img" placeholder="Link ảnh" />
      <button onclick="submitForm()">Lưu</button>

      <h2>Danh sách Tin Tức</h2>
      <div id="list"></div>
    </div>

    <script>
      const api = 'https://67ac56315853dfff53da3fd1.mockapi.io/Tin_Tuc';
      let editingId = null;

      async function fetchData() {
        const res = await fetch(api);
        const data = await res.json();
        const list = document.getElementById('list');
        list.innerHTML = '';

        data.forEach(item => {
          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = `
          <img src="${item.imgTinTuc}" />
          <div class="card-info">
            <h3>${item.title}</h3>
            <p>${item.desc}</p>
            <div class="actions">
              <button onclick="editItem('${item.id}')">✏️ Sửa</button>
              <button onclick="deleteItem('${item.id}')">🗑️ Xóa</button>
            </div>
          </div>
        `;
          list.appendChild(div);
        });
      }

      async function submitForm() {
        const title = document.getElementById('title').value.trim();
        const desc = document.getElementById('desc').value.trim();
        const img = document.getElementById('img').value.trim();

        if (!title || !desc || !img) {
          alert('Vui lòng điền đầy đủ thông tin');
          return;
        }

        const payload = {title, desc, imgTinTuc: img};

        if (editingId) {
          await fetch(`${api}/${editingId}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
          });
          editingId = null;
        } else {
          await fetch(api, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
          });
        }

        resetForm();
        fetchData();
      }

      function editItem(id) {
        fetch(`${api}/${id}`)
          .then(res => res.json())
          .then(item => {
            document.getElementById('title').value = item.title;
            document.getElementById('desc').value = item.desc;
            document.getElementById('img').value = item.imgTinTuc;
            editingId = id;
          });
      }

      function resetForm() {
        document.getElementById('title').value = '';
        document.getElementById('desc').value = '';
        document.getElementById('img').value = '';
      }

      async function deleteItem(id) {
        if (confirm('Bạn chắc chắn muốn xóa tin này?')) {
          await fetch(`${api}/${id}`, {method: 'DELETE'});
          fetchData();
        }
      }

      fetchData();
    </script>
  </body>
</html>
